# HOST nginx vhost for majidf.ca — PHASE 1 (HTTP only, before DNS and the certificate).
# Installed as /etc/nginx/sites-available/majidf.ca; replaced by majidf.ca.conf once
# certbot has issued the certificate. Lets you check the site with a Host header:
#   curl -H 'Host: majidf.ca' http://91.99.207.212/

server {
    listen 80;
    listen [::]:80;
    server_name majidf.ca www.majidf.ca panel.majidf.ca admin.majidf.ca;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
