# HOST nginx vhost for majidf.ca, panel.majidf.ca, admin.majidf.ca — PHASE 2 (TLS).
# Version-controlled copy of /etc/nginx/sites-available/majidf.ca on 91.99.207.212.
#
# A REVERSE PROXY only. The app runs in docker-compose.prod.yml; Caddy listens on
# 127.0.0.1:8094 and serves the SPA + API for all three hosts (security headers come from there).
#
# Certificate (one for all four names):
#   certbot certonly --webroot -w /var/www/html --cert-name majidf.ca \
#     -d majidf.ca -d www.majidf.ca -d panel.majidf.ca -d admin.majidf.ca \
#     --deploy-hook 'systemctl reload nginx'
# No `http2` on the listen lines: nginx 1.24 applies it to every vhost on the address
# (SERVER-RUNBOOK.md §6.1).

server {
    listen 80;
    listen [::]:80;
    server_name majidf.ca www.majidf.ca panel.majidf.ca admin.majidf.ca;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.majidf.ca;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/majidf.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/majidf.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://majidf.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name majidf.ca panel.majidf.ca admin.majidf.ca;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/majidf.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/majidf.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Receipt uploads are capped at 10 MB by the app, PHP at 20 MB.
    client_max_body_size 25M;

    access_log /var/log/nginx/majidf.access.log;
    error_log  /var/log/nginx/majidf.error.log;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        # Caddy trusts 127.0.0.1 and passes these on; Laravel trusts all proxies (bootstrap/app.php).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
